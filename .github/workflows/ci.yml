name: CI

# Build, test, and lint on every push to main and every PR. This works now that the shared
# core crates are git-pinned (ADR 0002 path→git migration) — cargo can resolve the workspace
# in CI without a sibling checkout. The unit suite is headless (no window/GPU), so a plain
# ubuntu-latest runner suffices; the `--ignored` app-matrix smokes (which spawn real programs)
# are not run here.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # winit/wayland build helpers (most of the display stack is dlopened at runtime, so this
      # is a small, conservative set). `zsh` is the shell `sampa-preview` runs previews under —
      # the `preview_never_mutates_the_filesystem` test needs it to exercise the "cat runs" path.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev zsh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p sampa-native --locked

      - name: Test
        run: cargo test -p sampa-native --locked

      # Not `-D warnings` yet: one pre-existing `too_many_arguments` (mouse_report) would fail
      # it. Runs as a report so new lints are visible without blocking the gate.
      - name: Clippy
        run: cargo clippy -p sampa-native --all-targets --locked

  bench:
    name: VT ingest throughput (trend)
    runs-on: ubuntu-latest
    needs: test
    # `actions: read` lets us pull the previous run's metrics artifact for the trend baseline.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p sampa-native --locked

      # Trend baseline: the throughput from the most recent successful CI run on the base
      # branch (same runner class, so the comparison is meaningful). Best-effort — the first
      # run ever, or a fork PR with a read-only token, simply has no baseline and skips it.
      - name: Baseline from previous run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          prev=$(gh run list -w CI -b "$BASE_REF" -s success -L 1 \
                   --json databaseId -q '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            gh run download "$prev" -n perf-metrics -D prev 2>/dev/null || true
          fi
          if [ -f prev/perf-metrics.json ]; then
            base=$(jq -r '.mib_per_s // empty' prev/perf-metrics.json)
            echo "PERF_BASELINE=$base" >> "$GITHUB_ENV"
            echo "baseline: $base MiB/s (run $prev)"
          else
            echo "no previous metrics — first run or unavailable; trend skipped"
          fi

      # Non-gating perf trend: MiB/s + the %Δ vs the baseline land in the run Summary, and the
      # metrics are uploaded so the next run can diff against this one (docs/perf.md).
      - name: Bench (VT ingest)
        run: |
          echo '### VT ingest throughput (trend)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ./target/release/sampa2 --bench 50 ${PERF_BASELINE:+--baseline "$PERF_BASELINE"} \
            --out perf-metrics.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics (next run's baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-metrics
          path: perf-metrics.json
          if-no-files-found: warn
