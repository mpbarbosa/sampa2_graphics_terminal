name: Release

# Cut a GitHub Release whenever a version tag is pushed. git-cliff turns the tag's
# Conventional Commits into release notes — it reads only git history, so this works
# despite the crate's path deps to the sibling sampa_graphics_terminal repo (which a
# cargo-based tool like release-plz could not resolve in CI). See docs/RELEASING.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes for this tag
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
