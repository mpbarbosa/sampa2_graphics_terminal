<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark terminal body: subtle diagonal gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="0.55" stop-color="#16161e"/>
      <stop offset="1" stop-color="#0b0c12"/>
    </linearGradient>
    <!-- Prompt chevron: cyan → violet (truecolor / GPU vibe) -->
    <linearGradient id="chev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <!-- Top gloss highlight -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Squircle body -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <!-- Inner hairline border for depth -->
  <rect x="24.5" y="24.5" width="463" height="463" rx="111.5" fill="none"
        stroke="#7dcfff" stroke-opacity="0.18" stroke-width="2"/>
  <!-- Gloss on the upper half -->
  <rect x="24" y="24" width="464" height="232" rx="112" fill="url(#gloss)"/>

  <!-- Prompt: ❯ chevron + block cursor, the classic terminal glyph -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- soft glow behind the chevron -->
    <path d="M168 176 L268 256 L168 336" stroke="#7dcfff" stroke-opacity="0.35"
          stroke-width="40" filter="url(#soft)"/>
    <path d="M168 176 L268 256 L168 336" stroke="url(#chev)" stroke-width="40"/>
  </g>
  <!-- Block cursor (amber, like a classic terminal caret) -->
  <rect x="300" y="300" width="76" height="40" rx="8" fill="#e0af68"/>

  <!-- "2" version badge, bottom-right -->
  <g>
    <circle cx="392" cy="392" r="58" fill="#0b0c12" stroke="#e0af68" stroke-opacity="0.9" stroke-width="4"/>
    <text x="392" y="393" text-anchor="middle" dominant-baseline="central"
          font-family="'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="72" font-weight="700" fill="#e4d5c7">2</text>
  </g>
</svg>
