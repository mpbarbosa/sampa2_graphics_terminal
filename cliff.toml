# git-cliff configuration — generate CHANGELOG.md from Conventional Commits.
#   git-cliff -o CHANGELOG.md            # regenerate the whole file
#   git-cliff --tag vX.Y.Z -o CHANGELOG.md   # cut a release section
#   git-cliff --bumped-version           # print the next semver from unreleased commits
# git-cliff reads only git history (no cargo), so it works despite the path deps to the
# sibling sampa_graphics_terminal repo.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows\
 [Keep a Changelog](https://keepachangelog.com/), and this project adheres to\
 [Semantic Versioning](https://semver.org/). Entries are derived from\
 [Conventional Commits](https://www.conventionalcommits.org/).\n
"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"

# Map commit types to changelog sections; `skip = true` drops noisy ones.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^build", group = "Build System" },
  { message = "^test", group = "Testing" },
  { message = "^ci", skip = true },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^style", skip = true },
  { message = "^revert", group = "Reverts" },
]
