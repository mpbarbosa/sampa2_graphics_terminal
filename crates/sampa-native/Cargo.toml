[package]
name = "sampa-native"
version = "0.11.0"
edition.workspace = true
license.workspace = true
description = "Sampa — Rust-only (native) graphical terminal (Path C)."
# Not published to crates.io: it depends on git-pinned crates (which crates.io forbids).
# The version/tag/changelog are still managed via Conventional Commits + git-cliff.
publish = false

[[bin]]
name = "sampa2"
path = "src/main.rs"

# --- Shared headless core (origin repo), per ADR 0002 -------------------------
# Every core crate is now **git-pinned** to a rev in the origin repo — no sibling checkout
# needed, so `cargo build`/`test` are reproducible anywhere (this is the ADR 0002 path→git
# migration it anticipated "at the end of N1/N2", which also unblocks CI). Cargo searches the
# repo's subdirectories for each crate; bump a rev to pick up an origin-side change.
[dependencies]
# The six foundational headless crates (pty / config / cli / shellint / palette / man) —
# formerly local N0 path deps, pinned here at the same rev, GUI-free and unchanged per ADR 0002.
pty-core       = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b3d29e3ac9317540640754eab34b38b834c8fafb" }
sampa-config   = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b3d29e3ac9317540640754eab34b38b834c8fafb" }
sampa-cli      = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b3d29e3ac9317540640754eab34b38b834c8fafb" }
sampa-shellint = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b3d29e3ac9317540640754eab34b38b834c8fafb" }
sampa-palette  = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b3d29e3ac9317540640754eab34b38b834c8fafb" }
sampa-man      = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b3d29e3ac9317540640754eab34b38b834c8fafb" }
# Safe auto-run preview gate. Git-pinned per ADR 0002 (CI-reproducible), like every core
# crate — pinned at the rev that dropped `du` from the allowlist (the du treemap is the
# intended way to run du now).
sampa-preview  = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b6f2123d69ad6c9a331674f8b8e8dfca6d21cc1a" }
# Opt-in Claude-API command suggester (spec-ai-overlay.md). Headless like the rest;
# it is the only crate that can open a socket, and only when `[ai] enabled = true`.
# Pinned to a git rev (ADR 0002): CI-reproducible rather than resolved from a sibling checkout.
sampa-ai       = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "06651037515f4fe26e746328f7ff1c697e7aa86a" }
# ps(1) output-enhancement core (docs/spec-ps-output-enhancement.md). Headless
# parse-and-decorate; fails safe to raw so a non-`ps` stream is never mangled. Git-pinned
# per ADR 0002 (CI-reproducible), same as sampa-ai. The native renderer consumes the
# decorated model to draw the level-1a panel (that UI is Path C's own follow-up).
sampa-ps-decorate = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "f2e73c9252ed0bbbccff05d8eee1762d86b68915" }
# cd tree picker core (docs/spec-cd-tree-picker.md). Read-only directory navigation
# (list_subdirs / relativize) — no shell, no Tauri. Git-pinned per ADR 0002. The native
# tree UI that consumes it is Path C's follow-up; the chosen path is inserted, never run.
sampa-fsnav    = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "815594ffe69f07a011472391371dad040216400c" }
# du disk-usage treemap core (docs/spec-du-treemap.md). parse_du builds a size-aggregated
# tree from `du -k` output; no shell, no Tauri. Git-pinned per ADR 0002. The native treemap
# UI (squarify + zoom) that consumes it is Path C's follow-up; Enter inserts cd, never runs.
sampa-dumap    = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "affebda9f6de482667fc04190f95334946d00f25" }
# free memory gauge core (docs/spec-free-gauge.md). parse_free -> Mem/Swap stats; no shell,
# no Tauri. Git-pinned per ADR 0002. The native gauge UI that consumes it is Path C's
# follow-up; this view is purely informational (no insert action).
sampa-freemem  = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "5d918b00f8ec275f8d5ac5fb8c389b17ff732e57" }
# ping latency chart core (docs/spec-ping-chart.md). parse_ping -> per-packet RTTs + rtt
# summary; no shell, no Tauri. Git-pinned per ADR 0002. Consumed by the native latency-chart
# UI (ping_render — a per-packet RTT sparkline); informational (nothing composed or run).
sampa-pingdec  = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "3af5e4d8bca96a561ba2f9c04665e548e029f578" }
# df disk-free gauge core (docs/spec-df-gauge.md). parse_df -> per-filesystem usage rows;
# no shell, no Tauri. Git-pinned per ADR 0002. Consumed by the native disk-free gauge UI
# (df_render — one segmented bar per filesystem, fullest-first); informational (no insert).
sampa-dfdec    = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "20e8d8aed050e2bd6b4db99c16065c17e93fd3b1" }
# uptime load gauge core (docs/spec-load-gauge.md). parse_uptime -> load averages + up/users
# (expects C-locale output); no shell, no Tauri. Git-pinned per ADR 0002. Consumed by the
# native load-gauge UI (load_render — three core-scaled load bars); informational (no insert).
sampa-uptimedec = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b05ded339a8448bed19552341235dd550a2dbc17" }
# gh command cheat-sheet core (docs/spec-gh-cheatsheet.md). parse_gh_help -> grouped gh
# subcommands + parse_gh_description -> the command's intro paragraph; no shell, no Tauri.
# Git-pinned per ADR 0002. Consumed by the native man panel: a typed `gh` + Ctrl+Shift+M routes
# to gh_cheatsheet_lines (led by the description) instead of a man page (informational).
sampa-ghhelp   = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "2f8045d8f15d6d60466551c4fa8ada49e7ee3c7d" }
# cargo command cheat-sheet core (docs/spec-cargo-cheatsheet.md). parse_cargo_help -> the
# `Commands:` list (name + optional alias); no shell, no Tauri. Git-pinned per ADR 0002.
# Consumed by the native man panel like ghhelp: a typed `cargo` + Ctrl+Shift+M routes to
# cargo_cheatsheet_lines instead of a man page, a leaf (`cargo build`) shows raw help.
sampa-cargohelp = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "7cfdbec034f7532689e0d97c5c3fa22783ca32cb" }
# npm command cheat-sheet core (docs/spec-npm-cheatsheet.md). parse_npm_help -> the command
# names from `All commands:` (npm has no per-command descriptions); no shell, no Tauri.
# Git-pinned per ADR 0002. Consumed by the native man panel like ghhelp/cargohelp: a typed
# `npm` + Ctrl+Shift+M routes to npm_cheatsheet_lines instead of a man page, a leaf
# (`npm install`) shows raw help.
sampa-npmhelp  = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b3d29e3ac9317540640754eab34b38b834c8fafb" }
# docker command cheat-sheet core (docs/spec-docker-cheatsheet.md). parse_docker_help -> the
# grouped `… Commands:` list (name + desc + section; plugin `*` stripped); no shell, no Tauri.
# Git-pinned per ADR 0002. Consumed by the native man panel like the others: a typed `docker` +
# Ctrl+Shift+M routes to docker_cheatsheet_lines instead of a man page, a leaf (`docker run`)
# shows raw help.
sampa-dockerhelp = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "a8a1f1c3021bd2cdd0e4966df35958c0b8083f9f" }
# kubectl command cheat-sheet core (docs/spec-kubectl-cheatsheet.md). parse_kubectl_help -> the
# grouped command list (docker-shaped rows, but headers carry qualifiers like `Basic Commands
# (Beginner):` / cobra's `Available Commands:`, so a "contains command" header rule); no shell,
# no Tauri. Git-pinned per ADR 0002. Consumed by the native man panel like the others: a typed
# `kubectl` + Ctrl+Shift+M routes to kubectl_cheatsheet_lines, a leaf (`kubectl get`) shows raw help.
sampa-kubectlhelp = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "41b7dee238ba63bf7ae4307215254a178e55feaf" }
# helm command cheat-sheet core (docs/spec-helm-cheatsheet.md). parse_helm_help -> the cobra
# `Available Commands:` list (name + desc + section); no shell, no Tauri. Git-pinned per ADR
# 0002. Consumed by the native man panel like the others: a typed `helm` + Ctrl+Shift+M routes
# to helm_cheatsheet_lines, a leaf (`helm install`) shows raw help.
sampa-helmhelp = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "f9bb3ac061df6cb9dc4bc6e6f00d5e7c0ee21c8b" }
# netstat connections table core (docs/spec-netstat-table.md). parse_ss -> sockets from
# `ss -tunap` (ss is the data source: net-tools netstat is deprecated + drops the udp State
# column); no shell, no Tauri. Git-pinned per ADR 0002. Consumed by the native connections
# panel (net_render — a state-coloured, listening-first socket table); informational (no insert).
sampa-netdec   = { git = "https://github.com/mpbarbosa/sampa_graphics_terminal", rev = "b6d24e99a0418f9c6eb1a590afa2c7946de21712" }

anyhow = "1"
winit = "0.30.13"
alacritty_terminal = "0.26.0"
glyphon = "0.12.0"
wgpu = "30.0.0"
pollster = "1.0.1"
arboard = "3.6.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
base64 = "0.23.0"
accesskit = "0.17"
accesskit_winit = "0.23"

# --- Native stack (ADR 0003) — added incrementally for the N0 window ----------
# winit, wgpu, cosmic-text, alacritty_terminal, arboard land in the N0 spike.
